<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55557,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55557,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.89429,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">The Soul of Tire Track Freddy will</tspan><tspan x="0" dy="48px">be visible in the Office.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You must find pieces of its Body</tspan><tspan x="0" dy="48px">on the Cameras, and assemble it</tspan><tspan x="0" dy="48px">using the Soul as a blueprint.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Put it back together before the</tspan><tspan x="0" dy="48px">Soul fully fades away.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You can only obtain one Body piece</tspan><tspan x="0" dy="48px">at a time.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You must put him back together</tspan><tspan x="0" dy="48px">before clearing the Fright.</tspan></text></g></g></svg>