<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55557,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55557,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.89429,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">It appears once a Fright, with a</tspan><tspan x="0" dy="48px">four-digit code displayed on one</tspan><tspan x="0" dy="48px">of its monitors.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">MEMORIZE THIS CODE. At the end of</tspan><tspan x="0" dy="48px">the Fright, you will have to input</tspan><tspan x="0" dy="48px">the code into the Numpad.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">If you input the wrong code, you die.</tspan></text></g></g></svg>