<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55558,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55558,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.8943,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Find him on the Cameras and stare</tspan><tspan x="0" dy="48px">at him to fill up his Meter.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">If his Meter runs out OR becomes</tspan><tspan x="0" dy="48px">full, he'll enter the Office and</tspan><tspan x="0" dy="48px">slowly start to fade in.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Shine your Flashlight at him as he</tspan><tspan x="0" dy="48px">passes by the Hall entrance to undo</tspan><tspan x="0" dy="48px">his progress.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">After some time has passed, he will</tspan><tspan x="0" dy="48px">go back to the Cameras, but only</tspan><tspan x="0" dy="48px">once he is fully de-materialized.</tspan></text></g></g></svg>