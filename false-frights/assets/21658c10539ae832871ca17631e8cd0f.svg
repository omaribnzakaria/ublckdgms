<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55557,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55557,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.89429,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Six red eyes will be visible on the</tspan><tspan x="0" dy="48px">Office monitors.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Each time you lower the Cameras, a</tspan><tspan x="0" dy="48px">red eye will disappear.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">When the final one disappears,</tspan><tspan x="0" dy="48px">Red Eyes will appear in the Office.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Put on the Mask to make them go away.</tspan></text></g></g></svg>