<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="365.42786" height="75.76014" viewBox="0,0,365.42786,75.76014"><g transform="translate(-137.28608,-3.0865)"><g stroke-miterlimit="10"><path d="M138.03608,78.09662v-74.26014h363.92786v74.26014z" fill-opacity="0.74902" fill="#000000" stroke="#000000" stroke-width="0"/><path d="M138.03608,78.09664v-74.26014h363.92786v74.26014z" fill="none" stroke="#bf0000" stroke-width="1.5"/><path d="M138.03608,78.09664v-74.26014h363.92786v74.26014z" fill="none" stroke="#ff0000" stroke-width="0.75"/><path d="M143.696,73.18855v-64.44399h352.60801v64.44399z" fill="none" stroke="none" stroke-width="0"/><text transform="translate(145.85229,19.88412) scale(0.25917,0.25917)" font-size="40" xml:space="preserve" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Retro Gaming&quot;, Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">CHICA THE KILLER:</tspan><tspan x="0" dy="46.15px">She stays in Camera 11, slowly fading in. To stop this,</tspan><tspan x="0" dy="46.15px">put down the Cameras while looking at her. She will</tspan><tspan x="0" dy="46.15px">then appear in the Office. Input the four numbers</tspan><tspan x="0" dy="46.15px">she speaks into the Numpad to get her away.</tspan></text></g></g></svg>