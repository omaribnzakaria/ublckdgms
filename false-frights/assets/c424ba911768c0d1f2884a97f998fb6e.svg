<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55557,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55557,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.89429,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">She starts in Camera 10 and makes</tspan><tspan x="0" dy="48px">her way to the Office.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">When she leaves a room, it becomes</tspan><tspan x="0" dy="48px">MOLDED. She moves twice as fast in</tspan><tspan x="0" dy="48px">MOLDED rooms.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Clean the MOLD out of rooms with</tspan><tspan x="0" dy="48px">the "CLEAN" button on the Cameras.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Put on the Mask to make her go away.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Her Exposure gain and warning before</tspan><tspan x="0" dy="48px">she enters scales with how many rooms</tspan><tspan x="0" dy="48px">are MOLDED.</tspan></text></g></g></svg>