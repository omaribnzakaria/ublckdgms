<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55557,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55557,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.89429,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">It will try to escape the Office</tspan><tspan x="0" dy="48px">through either one of the Vents</tspan><tspan x="0" dy="48px">or the Hall.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">If it is trying to leave through</tspan><tspan x="0" dy="48px">a Vent, shock whichever one it's</tspan><tspan x="0" dy="48px">going towards.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">If it is trying to leave through</tspan><tspan x="0" dy="48px">the Hall, shine your Flashlight</tspan><tspan x="0" dy="48px">to bring it back.</tspan></text></g></g></svg>