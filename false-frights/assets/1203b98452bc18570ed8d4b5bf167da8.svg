<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="354.04031" height="64.44399" viewBox="0,0,354.04031,64.44399"><g transform="translate(-280.32454,-288.48856)"><g stroke="none" stroke-miterlimit="10"><text transform="translate(282.48083,299.62811) scale(0.25917,0.25917)" font-size="40" xml:space="preserve" fill="#ff0000" stroke-width="1" font-family="&quot;Retro Gaming&quot;, Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">ENDLESS CYCLE OF DEATH (ECOD):</tspan><tspan x="0" dy="46.150000000000006px">Piles of scrap will be on three different cameras. If</tspan><tspan x="0" dy="46.150000000000006px">you see one of the piles is gone, ECOD will appear</tspan><tspan x="0" dy="46.150000000000006px">after you flip down the Cameras. Quickly don the Mask</tspan><tspan x="0" dy="46.150000000000006px">once it appears to get it to go away.</tspan></text><path d="M280.32454,352.93255v-64.44399h352.60801v64.44399z" fill="none" stroke-width="0"/></g></g></svg>