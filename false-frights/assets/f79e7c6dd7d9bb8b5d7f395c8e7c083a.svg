<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55558,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55558,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.8943,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Every time you open the Cameras,</tspan><tspan x="0" dy="48px">a popup appears on the screen.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Click the camera buttons in the</tspan><tspan x="0" dy="48px">order the popup displays.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You have infinite time to do this,</tspan><tspan x="0" dy="48px">just make sure you get it done</tspan><tspan x="0" dy="48px">BEFORE the Cameras are lowered.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You are allowed to skip completing</tspan><tspan x="0" dy="48px">his task twice before he kills you</tspan><tspan x="0" dy="48px">from it.</tspan></text></g></g></svg>