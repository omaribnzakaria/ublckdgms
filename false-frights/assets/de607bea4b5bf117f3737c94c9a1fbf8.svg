<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="357.0606" height="248.66667" viewBox="0,0,357.0606,248.66667"><g transform="translate(-141.4697,-111.33339)"><g stroke-miterlimit="10"><path d="M141.4697,360.00006v-248.66666h357.0606v248.66667z" fill="none" stroke="#000000" stroke-width="0"/><text transform="translate(156.0011,268.87129) scale(0.28034,0.28034)" font-size="40" xml:space="preserve" fill-opacity="0.50196" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Low-Spec Mode disables RAM-intensive VFX and is intended</tspan></text><text transform="translate(166.16341,282.32759) scale(0.28034,0.28034)" font-size="40" xml:space="preserve" fill-opacity="0.50196" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">only for devices with less than 16GB of dedicated RAM.</tspan></text><text transform="translate(164.06088,301.08695) scale(0.28034,0.28034)" font-size="40" xml:space="preserve" fill-opacity="0.50196" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">If you experience a random blackout of the game window</tspan></text><text transform="translate(192.09488,314.54328) scale(0.28034,0.28034)" font-size="40" xml:space="preserve" fill-opacity="0.50196" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">during gameplay, try enabling Low-Spec Mode.</tspan></text><text transform="translate(175.27448,333.30262) scale(0.28034,0.28034)" font-size="40" xml:space="preserve" fill-opacity="0.50196" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Keeping the game window minimized until it is fully</tspan></text><text transform="translate(200.15466,346.75895) scale(0.28034,0.28034)" font-size="40" xml:space="preserve" fill-opacity="0.50196" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">loaded in will also help reduce blackouts.</tspan></text><text transform="translate(206.875,150.65019) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">ENABLE LOW-SPEC MODE?</tspan></text><text transform="translate(295.625,181.65263) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">(Y/N)</tspan></text></g></g></svg>