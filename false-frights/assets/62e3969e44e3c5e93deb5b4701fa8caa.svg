<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55557,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55557,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.89429,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">He will appear on multiple random</tspan><tspan x="0" dy="48px">Cameras, and the specific ones</tspan><tspan x="0" dy="48px">he's on will change each time you</tspan><tspan x="0" dy="48px">raise the Cameras.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Do not put down the Cameras while</tspan><tspan x="0" dy="48px">looking at him.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">The first time you do it, the Camera</tspan><tspan x="0" dy="48px">will get BRICKED.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">The second time you do it, you die.</tspan></text></g></g></svg>