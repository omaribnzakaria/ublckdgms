<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55557,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55557,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.89429,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Click the telephone on your Office</tspan><tspan x="0" dy="48px">desk to answer "Phone Guy"'s call.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">He will then appear in the office,</tspan><tspan x="0" dy="48px">and with him a MUTE CALL button.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Click the button enough times to end</tspan><tspan x="0" dy="48px">the call and make "Phone Guy" leave.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You can call him in yourself to deal</tspan><tspan x="0" dy="48px">with him early, which will reset the</tspan><tspan x="0" dy="48px">time until he calls you next.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">He makes a noise when he's halfway</tspan><tspan x="0" dy="48px">to calling you.</tspan></text></g></g></svg>