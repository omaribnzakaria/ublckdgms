<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55557,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55557,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.89429,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Three piles of scrap will be visible</tspan><tspan x="0" dy="48px">on random Cameras.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">If you see one is gone, ECOD will</tspan><tspan x="0" dy="48px">appear in the Office the next time</tspan><tspan x="0" dy="48px">you lower the Cameras.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Put on the Mask to make him go away.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">He can enter on his own if he moves</tspan><tspan x="0" dy="48px">and the Cameras are not raised for</tspan><tspan x="0" dy="48px">an extended period of time.</tspan></text></g></g></svg>