<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="352.60801" height="64.44399" viewBox="0,0,352.60801,64.44399"><g transform="translate(-280.32454,-288.48856)"><g stroke="none" stroke-miterlimit="10"><path d="M280.32454,352.93255v-64.44399h352.60801v64.44399z" fill="none" stroke-width="0"/><text transform="translate(282.48083,299.62811) scale(0.25917,0.25917)" font-size="40" xml:space="preserve" fill="#ff0000" stroke-width="1" font-family="&quot;Retro Gaming&quot;, Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">THE ENTITY:</tspan><tspan x="0" dy="46.150000000000006px">Arrows facing different directions will be displayed</tspan><tspan x="0" dy="46.150000000000006px">on Camera 10. Input these directions using your IRL</tspan><tspan x="0" dy="46.150000000000006px">keyboard's Arrow Keys or WASD to fill up its meter</tspan><tspan x="0" dy="46.150000000000006px">before it runs out. A noise is audible when it's low.</tspan></text></g></g></svg>