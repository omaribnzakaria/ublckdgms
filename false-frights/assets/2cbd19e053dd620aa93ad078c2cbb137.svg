<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="431.71718" height="301.11111" viewBox="0,0,431.71718,301.11111"><g transform="translate(-0.55557,-58.88889)"><g stroke="none" stroke-miterlimit="10"><path d="M0.55557,360v-301.11111h431.71718v301.11111z" fill="none" stroke-width="0"/><text transform="translate(12.89429,87.67333) scale(0.36991,0.36991)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Motorist&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Periodically check the Hall to see</tspan><tspan x="0" dy="48px">if he is there.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">If you see him, you have a very</tspan><tspan x="0" dy="48px">short amount of time to put on the</tspan><tspan x="0" dy="48px">Mask before he enters.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">He will enter on his own if you do</tspan><tspan x="0" dy="48px">not reveal him quick enough.</tspan></text></g></g></svg>