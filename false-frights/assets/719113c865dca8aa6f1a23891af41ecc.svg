<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="365.42786" height="75.76014" viewBox="0,0,365.42786,75.76014"><g transform="translate(-137.28608,-3.08657)"><g stroke-miterlimit="10"><path d="M138.03608,78.09672v-74.26014h363.92786v74.26014z" fill-opacity="0.74902" fill="#000000" stroke="#000000" stroke-width="0"/><path d="M138.03608,78.09672v-74.26014h363.92786v74.26014z" fill="none" stroke="#bf0000" stroke-width="1.5"/><path d="M138.03608,78.09672v-74.26014h363.92786v74.26014z" fill="none" stroke="#ff0000" stroke-width="0.75"/><path d="M143.696,73.18864v-64.44399h352.60801v64.44399z" fill="none" stroke="none" stroke-width="0"/><text transform="translate(145.85229,19.88418) scale(0.25917,0.25917)" font-size="40" xml:space="preserve" fill="#ff0000" stroke="none" stroke-width="1" font-family="&quot;Retro Gaming&quot;, Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">"PHONE GUY":</tspan><tspan x="0" dy="46.15px">A telephone will be on your desk. When it rings, click</tspan><tspan x="0" dy="46.15px">it to call him in. Click the MUTE CALL button enough</tspan><tspan x="0" dy="46.15px">times to make him leave. When he's close to calling,</tspan><tspan x="0" dy="46.15px">he'll make a noise. You can call him early if needed.</tspan></text></g></g></svg>